name: mipiti-verify

# Runs on THIS fork only (avri-schneider/no_human). Fork main is kept synced to
# upstream's merged code, so the checkout's repo == git remote ==
# GITHUB_REPOSITORY == avri-schneider/no_human — which is what the fork-bound
# assertions require, and it carries the current code + tests. The job runs the
# tests that back the behavioral assertions, emits JUnit, and hands the reports
# to the mipiti-verify action: it signs a test attestation from them (tier1
# `test_attested`), then verifies — it runs no tests itself.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write   # Sigstore OIDC signing for the test attestation
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: mipiti-verify        # holds MIPITI_API_KEY (environment secret)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: web

      # Python tests backing the behavioral assertions -> JUnit. Each test here
      # is cited by a test_attested assertion (the runtime/adversarial evidence
      # the sufficiency judge requires): CORS/Host/env-scrub, SSH host-key,
      # MCP-schema, SQLi, plus the strict-CSP + clickjacking header test
      # (CTRL-20/21), the hostile-FTS5 search test (CTRL-45), the human-only
      # landing gate tests (CTRL-23) and the npm lockfile-pinning guard (CTRL-48).
      #
      # --cov-context=test records, per test, the src/no_human lines it executed.
      # `coverage json --show-contexts` exports that, and the action passes it to
      # `attest-tests --coverage`, so each test_attested carries the "reached"
      # fact its mechanism binding is credited on (rather than "reached: unknown",
      # which leaves the runtime clause to Tier 2 discretion).
      - run: >
          uv run pytest -q --junitxml=py-junit.xml
          --cov=src/no_human --cov-context=test --cov-report=
          tests/test_local_boundary_guard.py tests/test_child_env.py
          tests/test_git.py::test_git_run_never_disables_ssh_host_key_verification
          tests/test_mcp_bridge_schema.py
          tests/test_sql_injection_safety.py
          tests/test_api.py::test_responses_carry_a_strict_csp
          tests/test_api.py::test_board_html_has_no_inline_scripts_so_script_src_self_needs_no_nonce
          tests/test_session_search.py::test_hostile_fts_input_never_500s
          tests/test_gate_at_the_act.py
          tests/test_npm_lockfile_pinning.py
      - run: uv run coverage json --show-contexts -o coverage.json

      # Board tests backing the CTRL-36 (markdown XSS) assertions -> JUnit.
      - run: >
          node --test --test-reporter=junit
          --test-reporter-destination=board-junit.xml
          web/src/markdownSafety.test.mjs

      # Desktop shell tests backing the CTRL-64 (Electron renderer hardening)
      # assertions -> JUnit.
      - run: npm ci
        working-directory: desktop
      - run: >
          node --test --test-reporter=junit
          --test-reporter-destination=desktop-junit.xml
          desktop/mainIpc.test.mjs
          desktop/preloadTokenSafety.test.mjs

      # v0.53.1+: the action self-heals the attestation dir — its entrypoint
      # tries .mipiti/attestations under project-root and, when the checkout
      # isn't writable by the container's `verifier` user, falls back to
      # MIPITI_ATTESTATION_DIR under the container home (PR 389). No pre-create
      # step is needed.
      #
      # Gate revision 4 (v0.55.x): the sufficiency gate is quantifier-aware. A
      # universal runtime clause ("all"/"every"/"no X anywhere") is a forall
      # property that a sampled behavioral test cannot establish however strong
      # its reach/dependence; it is credited only from WHOLE-SCOPE evidence. This
      # release ships the two sound whole-scope assertion types that supply it:
      # `sink_default_deny` (over every site of a declared sink in scope, only a
      # form the safe-forms vocabulary admits, else a reviewed allowlist entry —
      # over-approximating, so an unclassifiable/reflection/dynamic site is a
      # violation) and `typed_boundary` (every sink position takes a value from a
      # declared constructor built only from literals/named constants — the
      # by-construction guarantee). The judge is also now shown each behavioral
      # assertion's mechanical reach/dependence facts as authoritative, so it no
      # longer re-decides invocation from source text. It signs a test
      # attestation from the JUnit reports (with per-test coverage below), then
      # verifies (Tier 1 + Tier 2). It runs no tests itself.
      #
      # Tier 2 is the semantic check that moves a sufficient control from
      # "implemented" to "verified". The provider key and model name are
      # environment secrets on the `mipiti-verify` environment; the action hands
      # the key only to the OpenAI SDK.
      # v0.55.3 patch: two Tier-2 verdict-stability fixes — a verdict is keyed on
      # the evidence content, not on where it sits in a file (a refactor that
      # moves code no longer re-judges), and a verdict whose judgments disagreed
      # is kept rather than re-asked next run. Both target the BORDERLINE/QUALITY
      # flicker seen on the pattern_matches / test_attested assertions.
      - uses: Mipiti/mipiti-verify@31ed139153124f2669f412521827e39988823950 # v0.55.3
        with:
          api-key: ${{ secrets.MIPITI_API_KEY }}
          model-id: ${{ vars.MIPITI_MODEL_ID }}
          junit-report: py-junit.xml board-junit.xml desktop-junit.xml
          coverage-report: coverage.json
          tier2-provider: openai
          tier2-model: ${{ secrets.MIPITI_TIER2_MODEL }}
          tier2-api-key: ${{ secrets.OPENAI_API_KEY }}
