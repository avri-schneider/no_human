name: mipiti-verify

# Runs on THIS fork only (avri-schneider/no_human). Fork main is kept synced to
# upstream's merged code, so the checkout's repo == git remote ==
# GITHUB_REPOSITORY == avri-schneider/no_human — which is what the fork-bound
# assertions require, and it carries the current code + tests. The job runs the
# tests that back the behavioral assertions, emits JUnit, and hands the reports
# to the mipiti-verify action: it signs a test attestation from them (tier1
# `test_attested`), then verifies — it runs no tests itself.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write   # Sigstore OIDC signing for the test attestation
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: mipiti-verify        # holds MIPITI_API_KEY (environment secret)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: web

      # Python tests backing the CORS/Host/env-scrub assertions -> JUnit.
      - run: >
          uv run pytest -q --junitxml=py-junit.xml
          tests/test_local_boundary_guard.py tests/test_child_env.py

      # Board tests backing the CTRL-36 (markdown XSS) assertions -> JUnit.
      - run: >
          node --test --test-reporter=junit
          --test-reporter-destination=board-junit.xml
          web/src/markdownSafety.test.mjs

      # The action (a Docker container) signs the attestation INTO .mipiti/ in
      # the workspace; the dir is still a bare mkdir under project-root in
      # v0.53.0 (attestation.py ATTESTATION_DIR), owned by the runner uid, so
      # pre-create it world-writable for the container's `verifier` user. Drop
      # this once mipiti-verify 0.53.1 ships PR 389's MIPITI_ATTESTATION_DIR
      # resolver (entrypoint redirects writes+reads under the container home).
      - run: mkdir -p .mipiti/attestations && chmod -R 0777 .mipiti

      # v0.53.0: production runs gate revision 3 — a runtime-class control whose
      # only evidence is a test_attested citation is insufficient unless a
      # structural sibling for the same mechanism also passes on that control.
      # This version carries the catalogue awareness that check needs, and closes
      # the --changed-files skip (#385). It signs a test attestation from the
      # JUnit reports, then verifies (Tier 1 + Tier 2). It runs no tests itself.
      #
      # Tier 2 is the semantic check that moves a sufficient control from
      # "implemented" to "verified". The provider key and model name are
      # environment secrets on the `mipiti-verify` environment; the action hands
      # the key only to the OpenAI SDK.
      - uses: Mipiti/mipiti-verify@49e2f62a4afb86e94cb4be41c9b0be043885ee04 # v0.53.0
        with:
          api-key: ${{ secrets.MIPITI_API_KEY }}
          model-id: "71013aa0-a0c7-45dc-9a3d-998196400e4f"
          junit-report: py-junit.xml board-junit.xml
          tier2-provider: openai
          tier2-model: ${{ secrets.MIPITI_TIER2_MODEL }}
          tier2-api-key: ${{ secrets.OPENAI_API_KEY }}
